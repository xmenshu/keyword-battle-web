<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>重新设置密码｜关键词作战工具</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#eef4ff,#f7f9fc);color:#172033}.card{width:min(440px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 18px 55px rgba(30,60,100,.13)}.brand{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf2ff;color:#1677ff;font-weight:700;font-size:13px}h1{font-size:25px;margin:18px 0 8px}.muted{color:#718096;font-size:14px;line-height:1.7;margin-bottom:18px}label{display:block;margin-top:14px;font-size:14px;font-weight:700}input,button{width:100%;padding:13px;margin-top:8px;border-radius:9px;font-size:15px}input{border:1px solid #d7deea;outline:none}input:focus{border-color:#1677ff;box-shadow:0 0 0 3px rgba(22,119,255,.1)}button{margin-top:20px;border:0;background:#1677ff;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.message{margin-top:14px;font-size:14px;line-height:1.6}.back{display:block;text-align:center;margin-top:18px;color:#1677ff;text-decoration:none;font-size:14px}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <span class="brand">关键词作战工具</span>
    <h1>重新设置密码</h1>
    <p id="intro" class="muted">请输入两次新密码。密码至少 8 位，建议同时包含字母和数字。</p>
    <form id="resetForm" class="hidden">
      <label for="newPassword">新密码</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位">
      <label for="confirmPassword">确认新密码</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="再次输入新密码">
      <button id="saveButton" type="submit">保存新密码</button>
    </form>
    <div id="message" class="message" role="status">正在验证重置链接……</div>
    <a class="back" href="./">返回登录</a>
  </main>
  <script>
    const client=supabase.createClient('https://cwqelnkhcscrozlggcim.supabase.co','sb_publishable_TnkdSnkam2DaK1_K5YwGpw_gRoGUYkN');
    const form=document.getElementById('resetForm');const message=document.getElementById('message');const button=document.getElementById('saveButton');
    function show(text,error=false){message.textContent=text;message.style.color=error?'#d92d20':'#079455'}
    async function checkSession(){
      const{data:{session}}=await client.auth.getSession();
      if(session){form.classList.remove('hidden');show('重置链接验证成功，请设置新密码。');return true}
      show('重置链接无效或已经过期，请返回登录页重新申请。',true);return false
    }
    client.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'||session){form.classList.remove('hidden');show('重置链接验证成功，请设置新密码。')}});
    form.addEventListener('submit',async event=>{
      event.preventDefault();const password=document.getElementById('newPassword').value;const confirm=document.getElementById('confirmPassword').value;
      if(password.length<8)return show('新密码至少需要 8 位。',true);if(password!==confirm)return show('两次输入的密码不一致。',true);
      button.disabled=true;show('正在保存新密码……');const{error}=await client.auth.updateUser({password});
      if(error){button.disabled=false;return show(`保存失败：${error.message}`,true)}
      form.classList.add('hidden');show('密码设置成功，即将返回登录页面。');await client.auth.signOut();setTimeout(()=>location.href='./',1800);
    });
    setTimeout(checkSession,500);
  </script>
</body>
</html>
